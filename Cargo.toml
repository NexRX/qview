[package]
name = "qview"
version = "0.1.0"
edition = "2024"

[lib]
path = "src/lib.rs"

[features]
backend-impl = ["dep:sqlx", "dep:tracing", "dep:tracing-subscriber"]

[dependencies]
# Backend implementation deps only
sqlx = { version = "0.9.0-alpha.1", features = [
    "runtime-tokio",
    "tls-rustls",
    "postgres",
], optional = true }
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", features = [
    "env-filter",
], optional = true }

# All Deps
derive_more = { version = "2", features = ["full"] }
itertools = "0.14"
serde = { version = "1.0", features = ["serde_derive"] }
thiserror = "2.0"

[dev-dependencies]
futures = "0.3"
rand = "0.10"
rstest = "0.26"
sqlx = { version = "0.9.0-alpha.1", features = [
    "runtime-tokio",
    "tls-rustls",
    "postgres",
] }
test-context = "0.5"
testcontainers = "0.27"
tokio = { version = "1.48", features = ["rt-multi-thread", "macros"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
